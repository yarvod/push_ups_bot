[project]
name = "pullups-bot"
version = "0.1.0"
description = "Telegram push-up club and its strictly non-netted beer ledger"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.22,<4",
  "arq>=0.26,<0.29",
  "dishka>=1.6,<2",
  "google-auth[requests]>=2.40,<3",
  "pydantic-settings>=2.10,<3",
  "requests>=2.32,<3",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1", "mypy>=1.17,<2", "types-requests>=2.32"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
