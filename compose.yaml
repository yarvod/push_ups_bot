name: pullups-bot

x-app: &app
  build: .
  image: pullups-bot:local
  env_file: .env
  environment:
    REDIS_URL: redis://redis:6379/0
    GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-service-account.json
    LLM_URL: http://llm:8080
    LLM_TIMEOUT_SECONDS: "25"
    LLM_MAX_TOKENS: "40"
    LLM_TEMPERATURE: "0.8"
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  depends_on:
    redis:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "3"
  mem_limit: 256m

services:
  bot:
    <<: *app
    command: [python, -m, pullups_bot]
    healthcheck:
      test: [CMD, python, -m, pullups_bot.health]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  worker:
    <<: *app
    command: [arq, pullups_bot.worker.WorkerSettings, --custom-log-dict, pullups_bot.logging_config.LOGGING]
    volumes:
      - ./secrets/google-service-account.json:/run/secrets/google-service-account.json:ro
    healthcheck:
      test: [CMD, python, -m, pullups_bot.health, worker]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    stop_grace_period: 120s

  banter:
    <<: *app
    command: [arq, pullups_bot.banter_worker.BanterWorkerSettings, --custom-log-dict, pullups_bot.logging_config.LOGGING]
    depends_on:
      redis:
        condition: service_healthy
      llm:
        condition: service_started
    healthcheck:
      test: [CMD, python, -m, pullups_bot.health, banter]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    stop_grace_period: 90s

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:00bd6c289c590e576948cb3639b8195e4d3e6dd6ba1d761f0e2b871fcd4df24f
    command: [-m, /models/Qwen3-0.6B-Q4_K_M.gguf, --host, 0.0.0.0, --port, "8080", --ctx-size, "1536", --threads, "1", --threads-batch, "1", --parallel, "1", --batch-size, "128", --ubatch-size, "64", --no-webui, --alias, banter]
    user: "10001:10001"
    volumes:
      - ./models:/models:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.75
    cpu_shares: 128
    mem_limit: 640m
    memswap_limit: 640m
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/health]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes", --appendfsync, always, --maxmemory, 128mb, --maxmemory-policy, noeviction]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    mem_limit: 192m

volumes:
  redis-data:
